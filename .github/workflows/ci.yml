name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
            echo "Waiting for MongoDB startup..."
            sleep 1
          done
          docker exec mongodb mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          until docker exec mongodb mongosh --eval "rs.isMaster().ismaster" | grep -q "true"; do
            echo "Waiting for replica set primary election..."
            sleep 1
          done
          echo "Replica set rs0 initialized and ready!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          TEST_MONGO_URI: "mongodb://127.0.0.1:27017/library_ci_test?replicaSet=rs0&directConnection=true"
          MONGO_URI: "mongodb://127.0.0.1:27017/library_ci_test?replicaSet=rs0&directConnection=true"
          JWT_SECRET: "12345678901234567890123456789012"
          FRONTEND_URL: "http://127.0.0.1:5173"

      - name: Build frontend
        run: npm run build
